[pytest]
# Pytest configuration for all backend services

testpaths =
    gateway-service/tests
    market-data-service/tests
    news-service/tests
    ml-signal-service/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests with database
    asyncio: Async tests
    slow: Slow tests

asyncio_mode = auto

# Coverage options
addopts =
    --verbose
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=html
    --cov-report=term-missing
